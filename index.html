<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hostel Management System</title>

    <!-- Tailwind CSS (used sparingly; most styling lives in css/style.css) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Chart.js for dashboard charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-root"></div>

    <!-- ============ App Scripts (load order matters) ============ -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>
    <script src="js/hostels.js"></script>
    <script src="js/rooms.js"></script>
    <script src="js/allocations.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/complaints.js"></script>
    <script src="js/notices.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/users.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
